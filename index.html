<!DOCTYPE html>
<html>
<head>
<title>Job Application Form</title>
<style>

body {
background-color: #f0f2f5;
font-family: Arial, Helvetica, sans-serif;
margin: 0;
padding: 20px;
}

.form-container {
background-color: #ffffff;
width: 600px;
margin: 0 auto;
padding: 30px;
border: 1px solid #cccccc;
border-radius: 6px;
}

h1 {
text-align: center;
color: #2c3e50;
margin-bottom: 5px;
}

p.subtitle {
text-align: center;
color: #666666;
margin-top: 0;
margin-bottom: 25px;
}

h2 {
color: #2c3e50;
background-color: #e8ecf1;
padding: 8px 12px;
border-left: 5px solid #2c3e50;
margin-top: 30px;
margin-bottom: 15px;
font-size: 18px;
}

label {
display: block;
margin-top: 12px;
margin-bottom: 5px;
font-weight: bold;
color: #333333;
}

input[type="text"],
input[type="number"],
input[type="password"],
input[type="email"],
input[type="tel"],
select {
width: 100%;
padding: 8px;
border: 1px solid #bbbbbb;
border-radius: 4px;
box-sizing: border-box;
font-size: 14px;
}

input[type="file"] {
margin-top: 5px;
}

.radio-group label,
.checkbox-group label {
display: inline-block;
font-weight: normal;
margin-right: 20px;
margin-top: 5px;
}

.radio-group input,
.checkbox-group input {
margin-right: 6px;
}

.button-row {
text-align: center;
margin-top: 30px;
}

input[type="submit"],
input[type="reset"] {
padding: 10px 25px;
font-size: 15px;
border-radius: 4px;
border: none;
cursor: pointer;
margin: 0 10px;
}

input[type="submit"] {
background-color: #2c3e50;
color: #ffffff;
}

input[type="reset"] {
background-color: #cccccc;
color: #000000;
}

</style>
</head>
<body>

<div class="form-container">

<h1>Job Application Form</h1>
<p class="subtitle">Please fill in all the details below</p>

<form action="#" method="post">

<h2>Personal Information</h2>

<label for="name">Full Name</label>
<input type="text" id="name" name="name">

<label for="age">Age</label>
<input type="number" id="age" name="age">

<label for="password">Password</label>
<input type="password" id="password" name="password">

<label for="retype_password">Retype Password</label>
<input type="password" id="retype_password" name="retype_password">

<h2>Security Information</h2>

<label for="security_question">Security Question</label>
<select id="security_question" name="security_question">
<option value="pet">What is your pet's name?</option>
<option value="school">What is the name of your first school?</option>
<option value="city">In which city were you born?</option>
<option value="mother">What is your mother's maiden name?</option>
</select>

<label for="security_answer">Security Answer</label>
<input type="text" id="security_answer" name="security_answer">

<h2>Contact Information</h2>

<label for="email">Email ID</label>
<input type="email" id="email" name="email">

<label for="home_phone">Home Phone Number</label>
<input type="tel" id="home_phone" name="home_phone">

<label for="office_phone">Office Phone Number</label>
<input type="tel" id="office_phone" name="office_phone">

<h2>Languages Known</h2>

<div class="checkbox-group">
<label><input type="checkbox" name="languages" value="Malayalam">Malayalam</label>
<label><input type="checkbox" name="languages" value="English">English</label>
<label><input type="checkbox" name="languages" value="Hindi">Hindi</label>
</div>

<h2>Gender</h2>

<div class="radio-group">
<label><input type="radio" name="gender" value="Male">Male</label>
<label><input type="radio" name="gender" value="Female">Female</label>
<label><input type="radio" name="gender" value="Other">Other</label>
</div>

<h2>Application Documents</h2>

<label for="cv">Upload CV</label>
<input type="file" id="cv" name="cv">

<div class="button-row">
<input type="submit" value="Submit">
<input type="reset" value="Reset">
</div>

</form>

</div>

</body>
</html>
